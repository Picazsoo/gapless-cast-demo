# Publishes public/ to GitHub Pages (Settings → Pages → Source: GitHub Actions).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The Cast app ID is not in the repo: set it under Settings → Secrets and variables → Actions → Variables → CAST_APP_ID.
      - name: Write config.js
        env:
          CAST_APP_ID: ${{ vars.CAST_APP_ID }}
        run: |
          printf "window.CAST_DEMO_CONFIG = { appId: '%s' };\n" "$CAST_APP_ID" > public/config.js
      # GitHub Pages lets browsers (and Cast devices) cache files for 10 minutes. Stamp
      # each script URL with the commit, so a new deploy loads new code right away.
      - name: Stamp the build and cache-bust scripts
        run: |
          printf "window.DEMO_BUILD = '%s';\n" "${GITHUB_SHA::7}" > public/version.js
          sed -i -E "s#(src=\"js/[a-z0-9-]+\.js|src=\"(config|version)\.js)\"#\1?v=${GITHUB_SHA::7}\"#g" public/index.html public/receiver.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
