<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gapless Cast demo receiver</title>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #e8eaed; font: 28px/1.4 system-ui, sans-serif; }
  main { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 8vw; box-sizing: border-box; }
  #mode { font-size: 22px; letter-spacing: .08em; text-transform: uppercase; color: #8ab4f8; }
  #title { font-size: 48px; font-weight: 600; margin: .2em 0; }
  #album { color: #9aa0a6; }
  .bar { height: 6px; background: #2a2f35; border-radius: 3px; margin-top: 1.2em; overflow: hidden; }
  #progress { height: 100%; width: 0; background: #8ab4f8; }
  #log { position: fixed; left: 8vw; right: 8vw; bottom: 4vh; font: 16px/1.3 ui-monospace, monospace; color: #6f7680; white-space: pre-wrap; max-height: 25vh; overflow: hidden; }
</style>
</head>
<body>
<main>
  <div id="mode">Waiting for a sender</div>
  <div id="title">Gapless Cast demo</div>
  <div id="album"></div>
  <div class="bar"><div id="progress"></div></div>
</main>
<div id="log"></div>
<audio id="audio"></audio>
<script src="js/flac-mp4.js"></script>
<script src="js/sample-accurate-sb.js"></script>
<script src="js/mse-queue.js"></script>
<script src="js/demo.js"></script>
<script src="js/cast-session.js"></script>
<script>
(function () {
  'use strict';
  var NS = 'urn:x-cast:dev.gapless.castdemo';
  var context = cast.framework.CastReceiverContext.getInstance();
  var el = document.getElementById('audio'), lines = [], lastTime = 0;
  function $(id) { return document.getElementById(id); }
  function send(msg) { try { context.sendCustomMessage(NS, undefined, msg); } catch (e) {} }
  function log(m) {
    lines.push(m); if (lines.length > 8) lines.shift();
    $('log').textContent = lines.join('\n');
    send({ type: 'log', data: m });
  }
  function onReport(type, data) {
    if (type === 'log') return log(data);
    if (type === 'error') { log('ERROR ' + data); send({ type: 'error', data: data }); return; }
    if (type === 'track') $('title').textContent = data.title;
    if (type === 'state' && data.mode) $('mode').textContent = { 'stock': 'Per-track, like YouTube Music', 'plain': 'Plain MSE queue', 'sample-accurate': 'Sample-accurate SourceBuffer' }[data.mode];
    if (type === 'time') {
      $('progress').style.width = Math.min(100, 100 * data.position / data.duration) + '%';
      if (Date.now() - lastTime < 1000) return;
      lastTime = Date.now();
    }
    if (type === 'state' && data.state === 'stopped') { $('title').textContent = 'Gapless Cast demo'; $('progress').style.width = '0'; }
    send({ type: type, data: data });
  }
  Demo.onReport(onReport);
  Demo.loadAlbum().then(function (a) { $('album').textContent = a.title + ' · ' + a.artist; });

  // What the page's "Report your result" form includes: technical details only.
  // The device's own name (e.g. "Living room") is never read or sent.
  function deviceInfo() {
    var caps = null;
    try { caps = context.getDeviceCapabilities(); } catch (e) {}
    function mse(t) { try { return MediaSource.isTypeSupported(t); } catch (e) { return false; } }
    return {
      userAgent: navigator.userAgent,
      capabilities: caps || {},
      mse: { opusWebm: mse('audio/webm; codecs="opus"'), flacMp4: mse('audio/mp4; codecs="flac"') },
      screen: screen.width + 'x' + screen.height
    };
  }
  context.addCustomMessageListener(NS, function (ev) {
    if (ev.data && ev.data.cmd === 'info') { send({ type: 'device', data: deviceInfo() }); return; }
    session.handle(ev.data);
  });
  // A real Cast media session: Google Home shows the album and can pause, seek
  // and skip; the position it shows is inside the current track.
  var session = CastSession(context, el, onReport);

  var options = new cast.framework.CastReceiverOptions();
  options.skipPlayersLoad = true;        // our own MSE stream, or plain WebM files per track: no MPL/Shaka needed
  var C = cast.framework.messages.Command;
  options.supportedCommands = C.ALL_BASIC_MEDIA | (C.QUEUE_NEXT || 0) | (C.QUEUE_PREV || 0) | (C.STREAM_TRANSFER || 0);
  options.disableIdleTimeout = true;
  options.customNamespaces = {};
  options.customNamespaces[NS] = cast.framework.system.MessageType.JSON;
  context.start(options);
  log('receiver ready: ' + navigator.userAgent);
})();
</script>
</body>
</html>
